variables:
  DOCKER_HOST: tcp://127.0.0.1:2375
  DOCKER_DRIVER: overlay2
  #ADD intelligeni specific variables here except the group variables. Avoid putting sensitive data directly here.
  #for image name "<image_name>" container image url will be "intelligeniedge.azurecr.io/<image_name>"
  # keep the name of project in sonarQube same as image_name here
  IMAGE_NAME: ig-servicenow-pack




default:
  image: docker:18.09.7
  services:
    - docker:18.09.7-dind
stages:
  # - test
  - unittest
  - verification
  - build
  - tag
  - publish


